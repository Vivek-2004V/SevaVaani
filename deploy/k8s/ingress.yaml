apiVersion: apps/v1
kind: Deployment
metadata:
  name: seva-vaani-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seva-vaani-redis
  template:
    metadata:
      labels:
        app: seva-vaani-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: seva-vaani-redis-svc
spec:
  selector:
    app: seva-vaani-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seva-vaani-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: sevavaani.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: seva-vaani-backend-svc
                port:
                  number: 8000
