<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notch Extended Navbar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 100%);
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="relative">

  <!-- Top Black Bar spanning full width (just like in reference image) -->
  <div class="w-full bg-black h-3 sm:h-4"></div>

  <!-- Centered Extended Notch Navbar -->
  <div class="relative w-full flex justify-center -mt-3 sm:-mt-4">
    
    <!-- Outer Left Concave Fillet Wing -->
    <div class="relative w-6 h-6 flex-shrink-0 self-start">
      <svg viewBox="0 0 24 24" class="w-full h-full block" fill="none">
        <path d="M 0 0 C 13.25 0 24 10.75 24 24 L 24 0 Z" fill="#000000" />
      </svg>
    </div>

    <!-- Main Notch Body -->
    <nav class="relative bg-black text-white px-5 py-2.5 rounded-b-2xl shadow-[0_12px_36px_rgba(0,0,0,0.7)] flex items-center gap-4 sm:gap-6 flex-shrink-0">
      
      <!-- Brand on Left -->
      <div class="flex items-center gap-2 cursor-pointer">
        <div class="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center font-black text-xs">
          🌱
        </div>
        <span class="text-sm font-black tracking-tight text-white">SEVA VAANI</span>
      </div>

      <!-- Nav Links in Middle -->
      <div class="flex items-center gap-1">
        <button class="bg-white text-black font-bold text-xs px-3.5 py-1.5 rounded-full shadow">
          <span>मुख्य पृष्ठ</span>
        </button>
        <button class="text-slate-300 hover:text-white px-3 py-1.5 text-xs font-medium">
          काम कैसे करता है?
        </button>
        <button class="text-slate-300 hover:text-white px-3 py-1.5 text-xs font-medium">
          सरकारी योजनाएं
        </button>
        <button class="text-slate-300 hover:text-white px-3 py-1.5 text-xs font-medium">
          नागरिकों की आवाज़
        </button>
        <button class="text-slate-300 hover:text-white px-3 py-1.5 text-xs font-medium">
          सहायता केंद्र
        </button>
      </div>

      <!-- CTA Button on Right -->
      <button class="bg-white hover:bg-slate-100 text-black font-bold text-xs px-3.5 py-1.5 rounded-full shadow flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>तकनीकी मैट्रिक्स</span>
      </button>

    </nav>

    <!-- Outer Right Concave Fillet Wing -->
    <div class="relative w-6 h-6 flex-shrink-0 self-start">
      <svg viewBox="0 0 24 24" class="w-full h-full block" fill="none">
        <path d="M 0 24 C 0 10.75 10.75 0 24 0 L 0 0 Z" fill="#000000" />
      </svg>
    </div>

  </div>

  <div class="p-12 text-center text-white">
    <h1 class="text-3xl font-black">Notch Extended Navbar Test</h1>
    <p class="text-sm opacity-80 mt-2">Checking the smooth concave wings and extended tab shape</p>
  </div>

</body>
</html>
