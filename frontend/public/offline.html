<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/" />
  <title>SEVA VAANI</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
    window.location.replace('/');
  </script>
</head>
<body style="background:#0f172a;color:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
  <div style="text-align:center;">
    <p style="font-size:18px;font-weight:700;">सेवा वाणी लोड हो रहा है...</p>
    <p style="font-size:14px;color:#94a3b8;">Loading main application...</p>
  </div>
</body>
</html>
